<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточка для канала · Катаемся Чатом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f4f0; --surface:#fff; --border:#e0e0d8;
    --accent-red:#d93025; --text:#1a1a1a; --muted:#888;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; padding:20px 14px 60px; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:22px; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
  h1 em { font-style:normal; color:var(--accent-red); }
  .sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
  .card-ui { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:10px 0 4px; }
  label:first-child { margin-top:0; }
  input[type=text], select { width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:14px; font-family:'Barlow',sans-serif; background:var(--bg); }
  .photo-btn { display:block; width:100%; border:1px dashed var(--border); border-radius:8px; padding:14px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; background:var(--bg); }
  .fmt { display:flex; gap:6px; margin-top:4px; }
  .fmt button { flex:1; border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:1px; cursor:pointer; color:var(--muted); }
  .fmt button.active { background:var(--text); color:#fff; border-color:var(--text); }
  .dl { display:block; width:100%; background:var(--accent-red); color:#fff; border:none; border-radius:10px; padding:14px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; margin-top:14px; }
  canvas { width:100%; height:auto; border-radius:12px; border:1px solid var(--border); display:block; }
  .status { font-size:12px; padding:8px 12px; border-radius:8px; margin-bottom:10px; line-height:1.4; }
  .status.ok { background:#e8f5e9; border:1px solid #c8e6c9; color:#2d5a30; }
  .status.err { background:#fdecea; border:1px solid #f1b7bd; color:#9c2b2b; }
  .hint { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Карточка <em>для канала</em></h1>
  <div class="sub">Данные подтягиваются из index.html — выбери этап, поправь что нужно, скачай PNG</div>

  <div id="status" class="status" style="display:none"></div>

  <div class="card-ui">
    <label>Этап (автозаполнение)</label>
    <select id="race-select" onchange="fillFromRace()"><option>Загружаю данные…</option></select>

    <label>Фото (подиум / трасса)</label>
    <input type="file" id="photo" accept="image/*" style="display:none" onchange="onPhoto(this)">
    <div class="photo-btn" id="photo-btn" onclick="document.getElementById('photo').click()">📷 Выбрать фото</div>

    <label>Заголовок</label>
    <input type="text" id="title" value="РЕЗУЛЬТАТЫ" oninput="draw()">

    <label>Дата · трасса</label>
    <input type="text" id="eyebrow" oninput="draw()">

    <label>Участников</label>
    <input type="text" id="count" placeholder="17 пилотов" oninput="draw()">

    <label>Подиум</label>
    <input type="text" id="p1" placeholder="🥇 Имя" style="margin-bottom:6px" oninput="draw()">
    <input type="text" id="p2" placeholder="🥈 Имя" style="margin-bottom:6px" oninput="draw()">
    <input type="text" id="p3" placeholder="🥉 Имя" oninput="draw()">

    <label>Подиум начинающих (пусто — не показывать)</label>
    <input type="text" id="b1" placeholder="1. Имя" style="margin-bottom:6px" oninput="draw()">
    <input type="text" id="b2" placeholder="2. Имя" style="margin-bottom:6px" oninput="draw()">
    <input type="text" id="b3" placeholder="3. Имя" oninput="draw()">

    <label>Быстрейший круг</label>
    <input type="text" id="fl" placeholder="Имя · 56.339" oninput="draw()">
    <div class="hint">Имя подставляется из данных, время кругa допиши руками, если знаешь.</div>

    <label>Формат</label>
    <div class="fmt">
      <button id="fmt45" class="active" onclick="setFmt(1080,1350,this)">4:5 · Лента</button>
      <button id="fmt11" onclick="setFmt(1080,1080,this)">1:1 · Квадрат</button>
    </div>
  </div>

  <canvas id="c" width="1080" height="1350"></canvas>
  <button class="dl" onclick="download()">⬇ Скачать PNG</button>
</div>

<script>
const RED = '#d93025';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let img = null;

// ════ ДАННЫЕ ИЗ index.html ════════════════════════════════════
// Источник истины один: card.html лежит рядом с index.html и
// вытаскивает из него RACES / BEGINNERS / шкалы / STANDINGS_EVENTS.
let RACES = [], BEGINNERS = {}, EVENTS = [], NAME2HANDLE = {};
const norm = h => (h || '').toLowerCase().replace('@','');
const driverKey = (h, n) => norm(h) || NAME2HANDLE[norm(n)] || norm(n);

function status(msg, ok) {
  const el = document.getElementById('status');
  el.style.display = 'block';
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
}

async function loadPortalData() {
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parsePortal(await res.text());
    status('✓ Данные подтянуты из index.html', true);
  } catch (err) {
    status('Не удалось прочитать index.html (' + err.message + '). Заполни поля руками — карточка работает и так.', false);
    document.getElementById('race-select').innerHTML = '<option>— данные недоступны —</option>';
    draw();
  }
}

function parsePortal(html) {
  const grab = re => { const m = html.match(re); if (!m) throw new Error('parse: ' + re); return m[0]; };
  const code =
    grab(/const RACES = \[[\s\S]*?\n\];/) +
    grab(/const BEGINNERS = \{[\s\S]*?\n\};/) +
    grab(/function fixBase\(v\) \{[\s\S]*?\n\}/) +
    grab(/function fixKipBase\(v\) \{[\s\S]*?\n\}/) +
    grab(/function fixModernBase\(v\) \{[\s\S]*?\n\}/) +
    grab(/const STANDINGS_EVENTS = \[[\s\S]*?\n\];/) +
    '\nreturn { RACES, BEGINNERS, STANDINGS_EVENTS };';
  const data = new Function(code)();
  RACES = data.RACES; BEGINNERS = data.BEGINNERS; EVENTS = data.STANDINGS_EVENTS;
  NAME2HANDLE = {};
  RACES.forEach(rc => rc.groups.forEach(g => g.results.forEach(r => {
    if (r.handle && r.name) NAME2HANDLE[norm(r.name)] = norm(r.handle);
  })));

  // Селектор этапов — последний по умолчанию
  const sel = document.getElementById('race-select');
  sel.innerHTML = RACES.map((r, i) =>
    `<option value="${i}" ${i === RACES.length - 1 ? 'selected' : ''}>${r.chipLabel} — ${r.location}</option>`
  ).join('');
  fillFromRace();
}

function setVal(id, v) { document.getElementById(id).value = v || ''; }

function fillFromRace() {
  const race = RACES[+document.getElementById('race-select').value];
  if (!race) return;
  const ev = EVENTS.find(e => e.raceId === race.id);
  const allRes = race.groups.flatMap(g => g.results);

  // Дата · трасса (из chipLabel: «6 Июня · Almeirim» → дата, локация — полная)
  const datePart = (race.chipLabel || '').split('·')[0].trim();
  setVal('eyebrow', `${datePart} · ${race.location}`);

  // Участники (уникальные гонщики)
  const uniq = new Set(allRes.map(r => driverKey(r.handle, r.name)));
  setVal('count', plural(uniq.size));

  // Подиум общий — pos 1..3 этапа
  const byPos = p => allRes.find(r => r.pos === p);
  setVal('p1', byPos(1)?.name); setVal('p2', byPos(2)?.name); setVal('p3', byPos(3)?.name);

  // Подиум начинающих — по begId этапа, топ-3 по общему месту
  const begSet = ev && BEGINNERS[ev.begId];
  const begs = begSet
    ? allRes.filter(r => begSet.has(driverKey(r.handle, r.name)) || begSet.has(norm(r.name)))
            .sort((a, b) => a.pos - b.pos).slice(0, 3)
    : [];
  setVal('b1', begs[0]?.name); setVal('b2', begs[1]?.name); setVal('b3', begs[2]?.name);

  // Быстрейший круг — имя из флагов r1fl/r2fl (время — руками)
  const flR1 = allRes.find(r => r.r1fl), flR2 = allRes.find(r => r.r2fl);
  const flParts = [];
  if (flR1) flParts.push(flR1.name + ' · Г1');
  if (flR2 && (!flR1 || flR2.name !== flR1.name)) flParts.push(flR2.name + ' · Г2');
  setVal('fl', flParts.join('  /  '));

  draw();
}

function plural(n) {
  const m10 = n % 10, m100 = n % 100;
  const w = (m10 === 1 && m100 !== 11) ? 'пилот'
          : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? 'пилота' : 'пилотов';
  return `${n} ${w}`;
}

// ════ РИСОВАНИЕ ═══════════════════════════════════════════════
function setFmt(w, h, btn) {
  cv.width = w; cv.height = h;
  document.querySelectorAll('.fmt button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  draw();
}

function onPhoto(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    img = new Image();
    img.onload = () => { document.getElementById('photo-btn').textContent = '✓ ' + f.name; draw(); };
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
}

function drawCover(image, W, H) {
  const ir = image.width / image.height, cr = W / H;
  let dw, dh;
  if (ir > cr) { dh = H; dw = H * ir; } else { dw = W; dh = W / ir; }
  ctx.drawImage(image, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

function v(id) { return document.getElementById(id).value.trim(); }

// Текст с ужатием до maxW (длинные имена не вылезают за край)
function fitText(text, font, maxW) {
  let size = parseInt(font.match(/(\d+)px/)[1]);
  ctx.font = font;
  while (ctx.measureText(text).width > maxW && size > 24) {
    size -= 2;
    ctx.font = font.replace(/\d+px/, size + 'px');
  }
}

function draw() {
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);

  if (img) drawCover(img, W, H);
  else { ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, W, H); }

  const g = ctx.createLinearGradient(0, H * 0.38, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.88)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const PAD = 64, MAXW = W - PAD * 2;
  let y = H - PAD;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  // Быстрейший круг
  const fl = v('fl');
  if (fl) {
    fitText('⚡ ' + fl, '500 32px Barlow', MAXW);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('⚡ ' + fl, PAD, y);
    y -= 54;
  }

  // Подиум начинающих — компактный блок
  const begs = [v('b1'), v('b2'), v('b3')].filter(Boolean);
  if (begs.length) {
    begs.reverse().forEach((name, i) => {
      const n = begs.length - i; // 3,2,1 снизу вверх
      const line = `${n}. ${name.replace(/^\d+\.\s*/, '').toUpperCase()}`;
      fitText(line, "700 38px 'Barlow Condensed'", MAXW);
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillText(line, PAD, y);
      y -= 48;
    });
    ctx.font = "700 26px 'Barlow Condensed'";
    ctx.fillStyle = RED;
    ctx.fillText('🏆 НАЧИНАЮЩИЕ', PAD, y);
    y -= 52;
  }

  // Подиум — снизу вверх: 3, 2, 1
  const podium = [['🥉', v('p3')], ['🥈', v('p2')], ['🥇', v('p1')]];
  podium.forEach(([medal, name], i) => {
    if (!name) return;
    const big = i === 2; // 🥇
    const font = (big ? '900 62px' : '700 50px') + " 'Barlow Condensed'";
    const line = medal + '  ' + name.replace(/^🥇|^🥈|^🥉/, '').trim().toUpperCase();
    fitText(line, font, MAXW);
    ctx.fillStyle = '#fff';
    ctx.fillText(line, PAD, y);
    y -= big ? 84 : 66;
  });
  y -= 8;

  // Участников — мелкой строкой над подиумом
  const count = v('count');
  if (count) {
    ctx.font = "700 32px 'Barlow Condensed'";
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(count.toUpperCase(), PAD, y);
    y -= 50;
  }

  // Заголовок
  const title = v('title') || 'РЕЗУЛЬТАТЫ';
  fitText(title.toUpperCase(), "900 104px 'Barlow Condensed'", MAXW);
  ctx.fillStyle = '#fff';
  ctx.fillText(title.toUpperCase(), PAD, y);
  const titleW = ctx.measureText(title.toUpperCase()).width;

  // Красная плашка: дата · трасса
  const eyebrow = v('eyebrow');
  if (eyebrow) {
    const ey = y - 118;
    fitText(eyebrow.toUpperCase(), "700 36px 'Barlow Condensed'", MAXW - 44);
    const tw = ctx.measureText(eyebrow.toUpperCase()).width;
    ctx.fillStyle = RED;
    ctx.fillRect(PAD, ey - 44, tw + 44, 62);
    ctx.fillStyle = '#fff';
    ctx.fillText(eyebrow.toUpperCase(), PAD + 22, ey);
  }

  // Красная линия-акцент под заголовком
  ctx.fillStyle = RED;
  ctx.fillRect(PAD, y + 16, Math.min(titleW, MAXW), 10);

  // Брендинг: верх
  ctx.font = "900 44px 'Barlow Condensed'";
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#fff';
  ctx.fillText('КАТАЕМСЯ', PAD, PAD + 38);
  ctx.fillStyle = RED;
  ctx.fillText('ЧАТОМ', PAD + ctx.measureText('КАТАЕМСЯ ').width, PAD + 38);
  ctx.font = "700 34px 'Barlow Condensed'";
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.textAlign = 'right';
  ctx.fillText('RACECHAT.PT', W - PAD, PAD + 36);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function download() {
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'racechat-card.png';
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

// Шрифты → данные → отрисовка
Promise.all([
  document.fonts.load("900 104px 'Barlow Condensed'"),
  document.fonts.load("700 36px 'Barlow Condensed'"),
  document.fonts.load("500 32px Barlow"),
]).then(() => { draw(); loadPortalData(); });
draw();
</script>
</body>
</html>

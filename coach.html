<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Разбор онборда · Катаемся Чатом</title>
<link rel="icon" href="photos/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700;800;900&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f4f4f0; --surface: #ffffff; --surface2: #f0f0ec; --border: #e0e0d8;
    --accent-red: #d93025; --text: #1a1a1a; --muted: #767676; --muted2: #bbb;
    --cond: 'Fira Sans Extra Condensed', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Fira Sans', sans-serif; min-height: 100vh; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; }

  nav {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(244,244,240,0.96); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px; height: 50px; display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: var(--cond); font-weight: 900; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; line-height: 1.1; color: var(--text); text-decoration: none; }
  .logo em { font-style: normal; color: var(--accent-red); }
  .lang-switcher { display: flex; gap: 2px; }
  .lang-btn { font-family: var(--cond); font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted2); cursor: pointer; padding: 8px 6px; border-radius: 4px; text-transform: uppercase; }
  .lang-btn.active { color: var(--text); background: var(--surface2); }

  .wrap { max-width: 600px; margin: 0 auto; padding-bottom: 48px; }

  /* steps = the portal's inner tabs */
  .steps { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 50px; z-index: 900; }
  .step {
    flex: 1 1 0; min-width: 0; padding: 13px 4px 11px; border-bottom: 2px solid transparent;
    font-family: var(--cond); font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted2); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step .n { margin-right: 5px; }
  .step.done { color: var(--muted); cursor: pointer; }
  .step.current { color: var(--text); border-bottom-color: var(--text); }

  .page-header { padding: 18px 14px 4px; }
  .page-eyebrow { font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent-red); margin-bottom: 3px; }
  .page-title { font-family: var(--cond); font-size: 28px; font-weight: 900; line-height: 1.05; }
  .page-sub { margin-top: 6px; font-size: 14px; line-height: 1.5; color: var(--muted); }

  .panel { display: none; padding: 14px 14px 0; }
  .panel.active { display: block; }

  .card-title { font-family: var(--cond); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
  .card-title:first-child { margin-top: 0; }

  .map-box { height: 280px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface2); }
  #map { width: 100%; height: 100%; }

  .list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 11px; width: 100%; min-height: 60px; padding: 9px 12px; text-align: left; cursor: pointer;
    border-top: 1px solid var(--border); transition: background .1s;
  }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--surface2); }
  .row.on { background: var(--text); color: #fff; }
  .row.on .r-meta { color: rgba(255,255,255,.65); }
  .r-logo { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); background: #fff; flex-shrink: 0; }
  .r-body { flex: 1; min-width: 0; }
  .r-name { font-family: var(--cond); font-weight: 900; font-size: 17px; letter-spacing: .3px; text-transform: uppercase; line-height: 1.1; }
  .r-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .r-go { font-family: var(--cond); font-weight: 900; font-size: 18px; color: var(--accent-red); }
  .row.on .r-go { color: #fff; }

  .ava { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border);
         display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 900; font-size: 16px; color: var(--muted); }

  .btn-reg { display: block; width: 100%; margin-top: 12px; background: var(--text); color: #fff; border: none; border-radius: 8px; padding: 14px;
             font-family: var(--cond); font-size: 15px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; text-decoration: none; cursor: pointer; }
  .btn-reg[disabled] { background: var(--surface2); color: var(--muted2); border: 1px solid var(--border); cursor: default; }
  .btn-line { display: block; width: 100%; margin-top: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
              font-family: var(--cond); font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; text-align: center; color: var(--text); text-decoration: none; cursor: pointer; }

  .event-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .event-card .pick { display: flex; align-items: center; gap: 11px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .event-desc { font-size: 14px; line-height: 1.6; }

  .note { margin: 22px 14px 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .note a { color: var(--text); }

  /* map pins */
  .pin { width: 38px; height: 38px; border-radius: 8px; overflow: hidden; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); background: #fff; }
  .pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pin.on { border-color: var(--accent-red); }
  .leaflet-tooltip.pin-label { background: var(--surface); border: 1px solid var(--border); box-shadow: none; border-radius: 4px; padding: 1px 6px;
    font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; color: var(--text); }
  .leaflet-tooltip.pin-label::before { display: none; }
  .leaflet-container { font-family: 'Fira Sans', sans-serif; }
  .leaflet-control-attribution { font-size: 9px; }
</style>
<script src="/rc-track.js" data-page="coach"></script>
</head>
<body>

<nav>
  <a class="logo" href="/">Катаемся<br><em>Чатом</em></a>
  <div class="lang-switcher">
    <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" data-lang="pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</nav>

<div class="steps" id="steps">
  <button type="button" class="step" data-step="1"><span class="n">1</span><span data-i="st1"></span></button>
  <button type="button" class="step" data-step="2"><span class="n">2</span><span data-i="st2"></span></button>
  <button type="button" class="step" data-step="3"><span class="n">3</span><span data-i="st3"></span></button>
</div>

<main class="wrap">
  <header class="page-header">
    <div class="page-eyebrow" data-i="eyebrow"></div>
    <h1 class="page-title" data-i="title"></h1>
    <p class="page-sub" data-i="sub"></p>
  </header>

  <section class="panel" id="p1">
    <div class="map-box"><div id="map" role="region" aria-label="Map"></div></div>
    <div class="card-title" data-i="tracks"></div>
    <div class="list" id="track-list"></div>
    <button type="button" class="btn-reg" id="to2" disabled></button>
  </section>

  <section class="panel" id="p2">
    <div class="card-title" id="p2-title"></div>
    <div class="list" id="coach-list"></div>
  </section>

  <section class="panel" id="p3">
    <div class="event-card">
      <div class="page-eyebrow" id="p3-eyebrow"></div>
      <div class="pick" id="p3-pick"></div>
      <p class="event-desc" data-i="s3text"></p>
      <a class="btn-reg" id="tg-btn" href="https://t.me/evgenybu" target="_blank" rel="noopener" data-i="s3btn"></a>
      <button type="button" class="btn-line" onclick="go(2)" data-i="change"></button>
    </div>
  </section>

  <p class="note"><span data-i="coachQ"></span> <a href="https://t.me/evgenybu" target="_blank" rel="noopener" data-i="coachA"></a></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── ДАННЫЕ: трассы и тренеры. Новые — дописать строкой. ──
var TRACKS = [
  { id: 'kip',     name: 'KIP Palmela',     place: 'Palmela',   logo: 'photos/venue-kip.png',     lat: 38.5787, lng: -8.8279 },
  { id: 'campera', name: 'Campera Karting', place: 'Carregado', logo: 'photos/venue-campera.png', lat: 39.0275, lng: -8.9645 }
];
// photo: null → инициалы; price: null → не показываем; tracks — id из TRACKS
var COACHES = [
  { id: 'miguel', name: 'Miguel Silva', photo: null,                  tracks: ['kip', 'campera'], price: null },
  { id: 'evgeny', name: 'Evgeny Buran', photo: 'photos/evgenybu.jpg', tracks: ['kip', 'campera'], price: null }
];

var I18N = {
  ru: {
    st1: 'Трасса', st2: 'Тренер', st3: 'Разбор',
    eyebrow: 'Разбор онборда', title: 'Стань на секунду быстрее',
    sub: 'Пришли пару кругов тренеру, который знает трассу. Он покажет, где ты теряешь время.',
    tracks: 'Трассы', next: 'Дальше — тренер', pickFirst: 'Выбери трассу',
    coachesAt: 'Тренеры', reviewAt: 'Разбор',
    coaches: function (n) { var a = n % 10, b = n % 100; return n + (a === 1 && b !== 11 ? ' тренер' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? ' тренера' : ' тренеров'); },
    s3text: 'Загрузка видео откроется скоро. Пока пришли онборд в Telegram — договоримся о первом разборе.',
    s3btn: 'Написать в Telegram', change: 'Другой тренер',
    coachQ: 'Ты тренер и хочешь разбирать онборды?', coachA: 'Напиши Евгению',
    tgMsg: function (c, t) { return 'Привет! Хочу разбор онборда у ' + c + ' (' + t + ').'; }
  },
  pt: {
    st1: 'Pista', st2: 'Treinador', st3: 'Análise',
    eyebrow: 'Análise de onboard', title: 'Sê um segundo mais rápido',
    sub: 'Envia algumas voltas a um treinador que conhece a pista. Ele mostra-te onde perdes tempo.',
    tracks: 'Pistas', next: 'Seguinte — treinador', pickFirst: 'Escolhe a pista',
    coachesAt: 'Treinadores', reviewAt: 'Análise',
    coaches: function (n) { return n + (n === 1 ? ' treinador' : ' treinadores'); },
    s3text: 'O envio de vídeo abre em breve. Por agora, manda o onboard no Telegram e combinamos a primeira análise.',
    s3btn: 'Escrever no Telegram', change: 'Outro treinador',
    coachQ: 'És treinador e queres analisar onboards?', coachA: 'Fala com o Evgeny',
    tgMsg: function (c, t) { return 'Olá! Quero uma análise de onboard com ' + c + ' (' + t + ').'; }
  },
  en: {
    st1: 'Track', st2: 'Coach', st3: 'Review',
    eyebrow: 'Onboard review', title: 'Be one second faster',
    sub: 'Send a few laps to a coach who knows the track. They show you where the time goes.',
    tracks: 'Tracks', next: 'Next — coach', pickFirst: 'Pick a track',
    coachesAt: 'Coaches', reviewAt: 'Review',
    coaches: function (n) { return n + (n === 1 ? ' coach' : ' coaches'); },
    s3text: 'Video upload opens soon. For now, send your onboard on Telegram and we will set up your first review.',
    s3btn: 'Message on Telegram', change: 'Another coach',
    coachQ: 'Are you a coach and want to review onboards?', coachA: 'Message Evgeny',
    tgMsg: function (c, t) { return 'Hi! I want an onboard review from ' + c + ' (' + t + ').'; }
  }
};

var S = { lang: 'ru', step: 1, track: null, coach: null, fitted: false };
try { var saved = localStorage.getItem('rc_lang'); if (saved && I18N[saved]) S.lang = saved; } catch (e) {}

function T(k) { return I18N[S.lang][k]; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function coachesFor(id) { return COACHES.filter(function (c) { return c.tracks.indexOf(id) !== -1; }); }
function initials(n) { return n.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
function avatar(c) { return c.photo ? '<img class="ava" src="' + esc(c.photo) + '" alt="">' : '<span class="ava" aria-hidden="true">' + esc(initials(c.name)) + '</span>'; }
function trackNames(c) { return c.tracks.map(function (id) { var t = byId(TRACKS, id); return t ? t.name : id; }).join(' · '); }

// ── MAP ──
var map = L.map('map', { scrollWheelZoom: true });
var ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom: 16, maxZoom: 18, attribution: '&copy; Esri &middot; &copy; OpenStreetMap'
}).addTo(map);
L.tileLayer(ESRI + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16, maxZoom: 18, pane: 'shadowPane' }).addTo(map);
TRACKS.forEach(function (t) {
  var m = L.marker([t.lat, t.lng], {
    icon: L.divIcon({ className: '', html: '<div class="pin" data-pin="' + t.id + '"><img src="' + esc(t.logo) + '" alt=""></div>', iconSize: [38, 38], iconAnchor: [19, 19] }),
    title: t.name, keyboard: true
  }).addTo(map);
  m.bindTooltip(t.name, { permanent: true, direction: 'bottom', offset: [0, 22], className: 'pin-label' });
  m.on('click', function () { pickTrack(t.id); });
});
function fitAll() { map.fitBounds(L.latLngBounds(TRACKS.map(function (t) { return [t.lat, t.lng]; })), { padding: [60, 60], maxZoom: 11 }); }
map.setView([38.80, -8.90], 9);

// ── ACTIONS ──
function pickTrack(id) {
  S.track = id;
  if (S.coach && byId(COACHES, S.coach).tracks.indexOf(id) === -1) S.coach = null;
  var t = byId(TRACKS, id);
  map.flyTo([t.lat, t.lng], Math.max(map.getZoom(), 12), { duration: 0.6 });
  render();
}
function pickCoach(id) { S.coach = id; go(3); }
function go(n) {
  if (n >= 2 && !S.track) return;
  if (n >= 3 && !S.coach) return;
  S.step = n;
  render();
  if (n === 1) setTimeout(function () { map.invalidateSize(); if (!S.track && !S.fitted) { fitAll(); S.fitted = true; } }, 0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setLang(l) { S.lang = l; try { localStorage.setItem('rc_lang', l); } catch (e) {} render(); }

// ── RENDER ──
function render() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === S.lang); });
  document.querySelectorAll('[data-i]').forEach(function (el) { var v = T(el.getAttribute('data-i')); if (typeof v === 'string') el.textContent = v; });

  var reach = S.coach ? 3 : (S.track ? 2 : 1);
  document.querySelectorAll('.step').forEach(function (b) {
    var n = +b.getAttribute('data-step'), ok = n <= reach;
    b.classList.toggle('current', n === S.step);
    b.classList.toggle('done', ok && n !== S.step);
    b.disabled = !ok;
    if (n === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.onclick = ok ? function () { go(n); } : null;
  });
  ['p1', 'p2', 'p3'].forEach(function (id, i) { document.getElementById(id).classList.toggle('active', S.step === i + 1); });

  document.getElementById('track-list').innerHTML = TRACKS.map(function (t) {
    var on = S.track === t.id;
    return '<button type="button" class="row' + (on ? ' on' : '') + '" aria-pressed="' + on + '" onclick="pickTrack(\'' + t.id + '\')">' +
      '<img class="r-logo" src="' + esc(t.logo) + '" alt="">' +
      '<span class="r-body"><span class="r-name" style="display:block">' + esc(t.name) + '</span>' +
      '<span class="r-meta" style="display:block">' + esc(t.place) + ' · ' + esc(T('coaches')(coachesFor(t.id).length)) + '</span></span></button>';
  }).join('');
  document.querySelectorAll('.pin').forEach(function (p) { p.classList.toggle('on', p.getAttribute('data-pin') === S.track); });
  var to2 = document.getElementById('to2');
  to2.disabled = !S.track; to2.textContent = S.track ? T('next') : T('pickFirst'); to2.onclick = function () { go(2); };

  var tr = S.track ? byId(TRACKS, S.track) : null;
  document.getElementById('p2-title').textContent = tr ? T('coachesAt') + ' · ' + tr.name : '';
  document.getElementById('coach-list').innerHTML = tr ? coachesFor(tr.id).map(function (c) {
    return '<button type="button" class="row" onclick="pickCoach(\'' + c.id + '\')">' + avatar(c) +
      '<span class="r-body"><span class="r-name" style="display:block">' + esc(c.name) + '</span>' +
      '<span class="r-meta" style="display:block">' + esc(trackNames(c)) + (c.price ? ' · €' + esc(c.price) : '') + '</span></span>' +
      '<span class="r-go" aria-hidden="true">→</span></button>';
  }).join('') : '';

  var co = S.coach ? byId(COACHES, S.coach) : null;
  document.getElementById('p3-eyebrow').textContent = tr ? T('reviewAt') + ' · ' + tr.name : '';
  document.getElementById('p3-pick').innerHTML = co ? avatar(co) + '<div class="r-body"><div class="r-name">' + esc(co.name) + '</div><div class="r-meta">' + esc(trackNames(co)) + '</div></div>' : '';
  document.getElementById('tg-btn').href = 'https://t.me/evgenybu' + (co && tr ? '?text=' + encodeURIComponent(T('tgMsg')(co.name, tr.name)) : '');
}

go(1);
</script>
</body>
</html>
